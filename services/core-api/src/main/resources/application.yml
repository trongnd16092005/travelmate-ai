spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travelmate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:travelmate}
    password: ${DB_PASSWORD:travelmate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

travelmate:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

