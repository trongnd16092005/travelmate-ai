spring:
  application:
    name: travelmate-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/travelmate.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
      data-source-properties:
        foreign_keys: true
        journal_mode: WAL
        busy_timeout: 5000
        synchronous: NORMAL

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:noreply@travelmate.local}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

  frontend-url: ${APP_FRONTEND_URL:http://localhost:8081}
  ai-service-url: ${APP_AI_SERVICE_URL:http://127.0.0.1:8000/internal/v1/ai}

  auth:
    require-email-verification: ${APP_AUTH_REQUIRE_EMAIL_VERIFICATION:false}

  rate-limit:
    default: 100
    ai-generate: 5
    ai-chat: 30
    ai-suggest: 20

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.travelmate: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:WARN}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
