spring:
  application:
    name: travelmate-backend

  datasource:
    url: jdbc:mysql://localhost:3306/travelmate_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root           # Đổi thành password MySQL của bạn
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # Dùng 'validate' khi production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /

# ─── JWT Configuration ───
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: 900000      # 15 phút (ms)
    refresh-token-expiration: 604800000  # 7 ngày (ms)

  frontend-url: http://localhost:8081    # React Native Expo dev server
  ai-service-url: ${APP_AI_SERVICE_URL:http://127.0.0.1:8000/internal/v1/ai}

  # Rate limiting (request tối đa mỗi phút)
  rate-limit:
    default: 100
    ai-generate: 5
    ai-chat: 30
    ai-suggest: 20

# ─── Springdoc OpenAPI ───
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.travelmate: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
