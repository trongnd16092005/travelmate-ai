name: travelmate

services:
  ai-service:
    build:
      context: ../services/ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORE_API_URL: http://core-api:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"

  core-api:
    build:
      context: ../services/core-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/travelmate.db
      APP_AI_SERVICE_URL: http://ai-service:8000/internal/v1/ai
      APP_AUTH_REQUIRE_EMAIL_VERIFICATION: ${APP_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
    ports:
      - "8080:8080"
    volumes:
      - core-data:/app/data
    depends_on:
      ai-service:
        condition: service_started

volumes:
  core-data:
